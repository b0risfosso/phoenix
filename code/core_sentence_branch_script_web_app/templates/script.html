<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Script Editor</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/styles.css"></head>
<body><header class="site-header"><div><h1>Script Editor</h1><p>{{ filename }}</p></div><nav><a href="/">Tree</a><a href="/outputs/scripts/{{ filename }}">Download</a><a href="/run/{{ filename }}" target="_blank">Open and run</a></nav></header><main class="single"><section class="panel"><div class="actions"><button id="saveScriptBtn">Save script</button><button id="copyScriptBtn" class="secondary">Copy script</button></div><p id="scriptStatus" class="status"></p><textarea id="scriptEditor" class="code-editor tall" spellcheck="false"></textarea></section></main><script>const filename = {{ filename|tojson }};</script><script src="/static/script.js"></script></body></html>
