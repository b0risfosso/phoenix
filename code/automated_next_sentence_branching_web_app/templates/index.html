<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Automated Next Sentence Branching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="site-header">
  <div>
    <h1>Automated Next Sentence Branching</h1>
    <p>Select a story in the tree, generate 20 next-sentence branches, then attach or modify scripts.</p>
  </div>
  <nav>
    <a href="/">Story tree</a>
    <a href="/api/data-location" target="_blank">Data location</a>
    <a href="/api/story-tree" target="_blank">Tree JSON</a>
  </nav>
</header>

<main class="layout">
  <aside class="panel">
    <h2>Story tree controls</h2>
    <label for="searchBox">Search story text or script</label>
    <input id="searchBox" type="text" placeholder="cell, membrane, trail, bacteria">

    <label class="checkline">
      <input id="scriptedOnlyCheck" type="checkbox">
      Only show branches with scripts
    </label>

    <div class="actions vertical-actions">
      <button id="refreshBtn">Refresh</button>
      <button id="expandAllBtn" class="secondary">Expand all</button>
      <button id="collapseAllBtn" class="secondary">Collapse all</button>
    </div>

    <hr>
    <h2>Selected story</h2>
    <p id="selectedStoryPreview" class="meta">Select a sentence node in the tree.</p>

    <hr>
    <h2>Data location</h2>
    <p id="dataLocation" class="meta"></p>
  </aside>

  <section class="panel wide">
    <div class="result-header">
      <h2>Story tree</h2>
      <p id="countLabel" class="meta"></p>
    </div>
    <div id="storyTree" class="story-tree"></div>
  </section>
</main>

<script src="/static/index.js"></script>
</body>
</html>
