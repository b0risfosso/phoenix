<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sentence / Simulation Cycle</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/styles.css"></head><body>
<header class="site-header"><div><h1>Sentence / Simulation Cycle</h1><p>Cycles through every sentence node and tied simulation scripts.</p></div><nav><a href="/api/cycle-items" target="_blank">Cycle JSON</a><a href="/api/data-location" target="_blank">Data location</a></nav></header>
<main class="cycle-layout">
<section class="stage panel"><div class="cycle-topline"><div><p id="counter" class="meta">0 / 0</p><h2 id="title">Loading...</h2></div><div class="timer-block"><div id="timerText">10</div><div class="progress-shell"><div id="progressBar"></div></div></div></div><p id="sentence" class="sentence-text"></p><div class="story-box"><h3>Story path</h3><div id="storyPath" class="story-path"></div><p id="storyText"></p></div><div class="script-box"><h3>Scripts tied to this sentence</h3><div id="scripts"></div></div></section>
<aside class="panel controls"><h2>Cycle controls</h2><label for="secondsInput">Seconds per item</label><input id="secondsInput" type="number" min="1" value="10"><div class="button-row"><button id="playPauseBtn">Pause</button><button id="prevBtn" class="secondary">Previous</button><button id="nextBtn" class="secondary">Next</button></div><label class="checkline"><input id="scriptsOnlyCheck" type="checkbox"> Only show sentences with scripts attached</label><label class="checkline"><input id="autoRunCheck" type="checkbox"> Auto-open first script for each sentence</label><label class="checkline"><input id="showSourceCheck" type="checkbox" checked> Show script preview</label><button id="reloadBtn" class="secondary">Reload items</button><hr><h2>Queue</h2><div id="queue" class="queue"></div></aside>
</main><script src="/static/cycle.js"></script></body></html>
