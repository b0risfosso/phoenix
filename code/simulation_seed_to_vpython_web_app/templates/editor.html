<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Script</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Script Editor</h1>
      <p id="filename">{{ filename }}</p>
    </div>
    <nav>
      <a href="/">Seeds</a>
      <a href="/script/{{ filename }}">View</a>
      <a href="/outputs/scripts/{{ filename }}">Download</a>
      <a href="/run/{{ filename }}" target="_blank">Open and run</a>
    </nav>
  </header>
  <main class="single">
    <section class="panel">
      <div class="actions">
        <button id="saveBtn">Save changes</button>
        <button id="saveCopyBtn" class="secondary">Save as copy</button>
        <button id="copyBtn" class="secondary">Copy</button>
      </div>
      <p id="status" class="status"></p>
      <textarea id="editor" class="code-editor" spellcheck="false"></textarea>
    </section>
  </main>
  <script>
    const filename = {{ filename|tojson }};
  </script>
  <script src="/static/editor.js"></script>
</body>
</html>
