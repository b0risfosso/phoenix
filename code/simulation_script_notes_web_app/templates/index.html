<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simulation Script Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Simulation Script Notes</h1>
      <p>Display generated VPython scripts and attach notes to each script.</p>
    </div>
    <nav>
      <a href="/">Scripts</a>
      <a href="/api/export-notes" target="_blank">Export notes JSON</a>
      <a href="/api/branches" target="_blank">Branches JSON</a>
    </nav>
  </header>

  <main class="layout">
    <section class="panel controls">
      <h2>Script library</h2>
      <p class="small">Scripts are read from the shared <code>simulation_shared_data/scripts/</code> folder.</p>

      <label for="searchBox">Search filename or notes</label>
      <input id="searchBox" type="text" placeholder="magnet, cell, orbit, bug, variation">

      <label for="noteFilter">Note presence</label>
      <select id="noteFilter">
        <option value="all">All scripts</option>
        <option value="with-notes">With notes</option>
        <option value="without-notes">Without notes</option>
      </select>

      <label for="noteTypeFilter">Note kind</label>
      <select id="noteTypeFilter">
        <option value="all">All note kinds</option>
        <option value="core_sentence">Core sentence notes</option>
        <option value="next_sentence">Next sentence notes</option>
      </select>

      <button id="refreshBtn">Refresh scripts</button>
      <p id="dataLocation" class="meta"></p>
    </section>

    <section class="panel wide">
      <div class="result-header">
        <h2>Scripts</h2>
        <p id="countLabel" class="meta"></p>
      </div>
      <div id="scriptList" class="cards"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
