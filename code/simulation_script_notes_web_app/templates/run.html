<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Running Simulation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Running Simulation</h1>
      <p>{{ filename }}</p>
    </div>
    <nav>
      <a href="/">Scripts</a>
      <a href="/outputs/logs/{{ log_filename }}" target="_blank">Open log</a>
    </nav>
  </header>
  <main class="single">
    <section class="panel">
      <p>Started local Python process: <strong>{{ pid }}</strong></p>
      <p>VPython should open its browser visualization separately. If it fails, open the log.</p>
      <a href="/outputs/logs/{{ log_filename }}" target="_blank">Open run log</a>
    </section>
  </main>
</body>
</html>
