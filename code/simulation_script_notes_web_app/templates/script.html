<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Script Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Script Notes</h1>
      <p id="filename">{{ filename }}</p>
    </div>
    <nav>
      <a href="/">Scripts</a>
      <a href="/outputs/scripts/{{ filename }}">Download script</a>
      <a href="/run/{{ filename }}" target="_blank">Open and run</a>
    </nav>
  </header>

  <main class="detail-layout">
    <section class="panel">
      <div class="result-header">
        <h2>Script</h2>
        <button id="copyScriptBtn" class="secondary">Copy script</button>
      </div>
      <pre id="source" class="raw"></pre>
    </section>

    <aside class="panel notes-panel">
      <h2>Notes</h2>

      <div class="note-form">
        <label for="noteType">Note kind</label>
        <select id="noteType">
          <option value="core_sentence">Core sentence note</option>
          <option value="next_sentence">Next sentence note</option>
        </select>

        <input id="noteTitle" type="text" placeholder="Note title optional">
        <textarea id="noteText" rows="6" placeholder="Write a core sentence or a possible next sentence for this script..."></textarea>
        <input id="noteTags" type="text" placeholder="tags separated by commas">
        <div class="actions">
          <button id="saveNoteBtn">Add note</button>
          <button id="cancelEditBtn" class="secondary" hidden>Cancel edit</button>
        </div>
        <p id="noteStatus" class="status"></p>
      </div>

      <div id="notesList" class="cards"></div>
    </aside>
  </main>

  <script>
    const filename = {{ filename|tojson }};
  </script>
  <script src="/static/script.js"></script>
</body>
</html>
