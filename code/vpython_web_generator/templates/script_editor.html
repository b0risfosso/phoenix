<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit VPython Script</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell wide-shell">
    <header class="hero hero-row">
      <div>
        <p class="eyebrow">Generated script editor</p>
        <h1>Modify a generated VPython script.</h1>
        <p class="subhead">Edit the saved Python file, save changes, save a copy, download, or run the edited simulation.</p>
      </div>
      <nav class="top-nav">
        <a href="/">Generator</a>
        <a href="/previous">Previous outputs</a>
      </nav>
    </header>

    <section class="panel editor-panel">
      <div class="panel-header split-header">
        <div>
          <p class="step">Editing</p>
          <h2 id="scriptEditorTitle">{{ filename }}</h2>
          <p id="scriptEditorMeta" class="detail-meta"></p>
        </div>
        <div class="button-row small-row wrap-row">
          <button id="reloadScriptButton" class="secondary">Reload</button>
          <button id="copyEditedScriptButton" class="secondary">Copy</button>
          <button id="saveScriptButton">Save changes</button>
          <button id="saveScriptCopyButton" class="secondary">Save as copy</button>
        </div>
      </div>

      <div id="scriptEditorStatus" class="status"></div>
      <div id="scriptEditorActions" class="downloads"></div>

      <label for="scriptSourceEditor">Python source</label>
      <textarea id="scriptSourceEditor" class="python-editor" spellcheck="false"></textarea>
    </section>
  </main>

  <script>
    window.SCRIPT_FILENAME = {{ filename|tojson }};
  </script>
  <script src="/static/script_editor.js"></script>
</body>
</html>
