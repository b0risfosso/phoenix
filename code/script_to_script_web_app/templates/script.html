<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Script Detail</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/styles.css"></head><body><header class="site-header"><div><h1>Script Detail</h1><p id="filename">{{ filename }}</p></div><nav><a href="/">Scripts</a><a href="/outputs/scripts/{{ filename }}">Download</a><a href="/run/{{ filename }}" target="_blank">Open and run</a></nav></header><main class="detail-layout"><section class="panel"><section class="info-panel"><h2>Sentence</h2><p id="sentenceText" class="sentence-text">Loading...</p></section><section class="info-panel"><h2>Story</h2><div id="storyPath" class="story-path"></div><p id="storyText" class="story-text"></p></section><section class="info-panel"><div class="result-header"><h2>Script</h2><div class="actions"><button id="saveSourceBtn">Save edits</button><button id="copySourceBtn" class="secondary">Copy</button></div></div><p id="sourceStatus" class="status"></p><textarea id="sourceEditor" class="code-editor" spellcheck="false"></textarea></section></section><aside class="panel"><h2>Attach new manual script</h2><p class="small">Creates a new script file and links it as a child of this script.</p><label for="childFilename">Child script filename optional</label><input id="childFilename" type="text"><label for="relationship">Relationship optional</label><input id="relationship" type="text" placeholder="variation, continuation, bugfix"><label for="childNote">Attachment note optional</label><textarea id="childNote" rows="3"></textarea><label for="childSource">Manual child script source</label><textarea id="childSource" rows="15" class="code-editor compact" spellcheck="false"></textarea><button id="addChildBtn">Save and attach child script</button><p id="childStatus" class="status"></p><hr><h2>Link existing script</h2><label for="existingChildFilename">Existing child filename</label><input id="existingChildFilename" type="text"><button id="linkExistingBtn" class="secondary">Link existing child</button><p id="linkExistingStatus" class="status"></p><hr><h2>Attached child scripts</h2><div id="childrenList" class="cards"></div><hr><h2>Parent scripts</h2><div id="parentsList" class="cards"></div></aside></main><script>const filename={{ filename|tojson }};</script><script src="/static/script.js"></script></body></html>
