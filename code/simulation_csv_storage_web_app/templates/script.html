<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CSV Script Attachment</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/styles.css"></head><body><header class="site-header"><div><h1>CSV Script Attachment</h1><p id="filename">{{ filename }}</p></div><nav><a href="/">Stories</a><a href="/outputs/scripts/{{ filename }}">Download</a></nav></header><main class="detail-layout"><section class="panel"><section class="script-panel"><div class="result-header"><h2>Main script</h2><div class="actions"><button id="saveMainBtn">Save main script edits</button><button id="copyMainBtn" class="secondary">Copy</button></div></div><p id="mainStatus" class="status"></p><textarea id="mainSource" class="code-editor" spellcheck="false"></textarea></section><section class="script-panel"><h2>Create CSV recorder child script</h2><p class="small">Paste or write the child script that records a 60-second simulation run to CSV.</p><label for="childFilename">Child CSV script filename optional</label><input id="childFilename" type="text" placeholder="bacteria-csv-recorder.py"><label for="childNote">Attachment note optional</label><textarea id="childNote" rows="3"></textarea><div class="actions"><button id="insertTemplateBtn" class="secondary">Insert starter CSV recorder template</button></div><label for="childSource">Child CSV script source</label><textarea id="childSource" class="code-editor child-editor" spellcheck="false"></textarea><button id="saveChildBtn">Save and attach CSV child script</button><p id="childStatus" class="status"></p></section></section><aside class="panel side-panel"><h2>CSV child scripts</h2><div id="childrenList" class="cards"></div><hr><h2>Link existing CSV script</h2><label for="existingChildFilename">Existing child filename</label><input id="existingChildFilename" type="text"><button id="linkExistingBtn" class="secondary">Link existing CSV child</button><p id="linkStatus" class="status"></p><hr><h2>Recent CSV runs for this script</h2><div id="runsList" class="cards"></div></aside></main><script>const filename={{ filename|tojson }};</script><script src="/static/script.js"></script></body></html>
