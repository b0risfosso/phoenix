<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Run CSV Script</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/styles.css"></head><body><header class="site-header"><div><h1>Run CSV Script</h1><p id="filename">{{ filename }}</p></div><nav><a href="/">Stories</a><a href="/script/{{ filename }}">Edit script</a><a href="/outputs/scripts/{{ filename }}">Download script</a></nav></header><main class="single"><section class="panel"><h2>Run CSV recorder</h2><p>This executes the selected CSV child script and stores CSV output under <code>csv_runs/</code>.</p><label for="runSeconds">Run seconds</label><input id="runSeconds" type="number" min="1" value="60"><button id="runBtn">Run CSV script</button><p id="runStatus" class="status"></p><div id="runResult" class="cards"></div></section></main><script>const filename={{ filename|tojson }};</script><script src="/static/run_csv.js"></script></body></html>
